<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RKB Workflow Map</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --border: #2c3744; --text: #e6e9ee;
    --muted: #8b97a6; --accent: #4aa3ff; --root: #2e7d32; --leaf: #7b4fb0;
    --inter: #b8860b; --single: #455160;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.45 -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex;
    gap: 12px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  input, select, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  input[type=search] { width: 280px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .stat { color: var(--muted); font-size: 12px; }
  .legend { display: flex; gap: 8px; align-items: center; margin-left: auto; }

  main { flex: 1; overflow: auto; padding: 12px 16px; }

  details.card {
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
    background: var(--panel); overflow: hidden;
  }
  details.card[open] { border-color: var(--accent); }
  summary.row {
    list-style: none; cursor: pointer; display: grid;
    grid-template-columns: 18px 1fr 110px 150px 130px 130px; gap: 10px;
    align-items: center; padding: 10px 12px;
  }
  summary.row::-webkit-details-marker { display: none; }
  .twisty { color: var(--muted); transition: transform .12s; }
  details.card[open] .twisty { transform: rotate(90deg); color: var(--accent); }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  summary.row:hover .name { color: var(--accent); }
  .deg, .date { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .col-head { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; color: #fff; }
  .role-root { background: var(--root); } .role-leaf { background: var(--leaf); }
  .role-intermediate { background: var(--inter); } .role-single { background: var(--single); }

  .body { border-top: 1px solid var(--border); padding: 12px; }
  .meta { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; }
  .meta div span { color: var(--muted); display: block; }
  .trigs-wrap { margin-bottom: 12px; }
  .trigs-wrap .col-head { display: block; margin-bottom: 6px; }
  .trigs { display: flex; gap: 6px; flex-wrap: wrap; }
  .trig { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 6px;
          font-size: 12px; border: 1px solid var(--border); background: #11161d; }
  .trig::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
  .trig.on::before { background: #3fb950; }
  .trig.off::before { background: #6e7681; }
  .trig.off { color: var(--muted); }
  .diagram { overflow: auto; }
  .diagram svg { max-width: none; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  #listhead {
    display: grid; grid-template-columns: 18px 1fr 110px 150px 130px 130px; gap: 10px;
    padding: 4px 12px 8px; align-items: end;
  }
</style>
</head>
<body>
<header>
  <h1>RKB Workflow Map</h1>
  <input type="search" id="filter" placeholder="Filter by name…" />
  <select id="roleFilter">
    <option value="">All roles</option>
    <option value="root">Root (entry points)</option>
    <option value="intermediate">Intermediate</option>
    <option value="leaf">Leaf</option>
    <option value="single">Single</option>
  </select>
  <select id="sortKey">
    <option value="name">Sort: Name</option>
    <option value="role">Sort: Role</option>
    <option value="outDeg">Sort: Calls</option>
    <option value="inDeg">Sort: Called by</option>
    <option value="createdAt">Sort: Created</option>
    <option value="updatedAt">Sort: Updated</option>
  </select>
  <button id="sortDir" title="Toggle sort direction">▲ Asc</button>
  <span class="stat" id="stat"></span>
  <div class="legend">
    <span class="badge role-root">root</span>
    <span class="badge role-intermediate">intermediate</span>
    <span class="badge role-leaf">leaf</span>
    <span class="badge role-single">single</span>
  </div>
</header>
<main>
  <div id="listhead">
    <span></span>
    <span class="col-head">Name</span>
    <span class="col-head">Role</span>
    <span class="col-head">Links</span>
    <span class="col-head">Created</span>
    <span class="col-head">Updated</span>
  </div>
  <div id="list"></div>
</main>

let state = { nodes: [], edges: [], byId: {}, children: {}, parents: {}, sortKey: "name", sortDir: 1 };

function buildIndex(data) {
  const byId = {}, children = {}, parents = {};
  for (const n of data.nodes) { byId[n.id] = n; children[n.id] = []; parents[n.id] = []; }
  for (const [from, to] of data.edges) {
    if (byId[from] && byId[to]) { children[from].push(to); parents[to].push(from); }
  }
  for (const n of data.nodes) {
    n.outDeg = children[n.id].length;
    n.inDeg = parents[n.id].length;
    n.role = n.inDeg && n.outDeg ? "intermediate" : n.outDeg ? "root" : n.inDeg ? "leaf" : "single";
    n.created = Number(n.createdAt); n.updated = Number(n.updatedAt);
  }
  return { nodes: data.nodes, edges: data.edges, byId, children, parents };
}

function load(data) {
  const idx = buildIndex(data);
  state = { ...state, ...idx };
  document.getElementById("stat").textContent = `${idx.nodes.length} workflows · ${idx.edges.length} links`;
  renderList();
}

function fmtDate(ms) {
  if (!ms) return "";
  return new Date(ms).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function fmtDateTime(ms) {
  if (!ms) return "";
  return new Date(ms).toLocaleString();
}

function currentRows() {
  const q = document.getElementById("filter").value.toLowerCase();
  const role = document.getElementById("roleFilter").value;
  let rows = state.nodes.filter(n =>
    (!q || n.name.toLowerCase().includes(q)) && (!role || n.role === role));
  const k = state.sortKey, dir = state.sortDir;
  rows.sort((a, b) => {
    let av = a[k], bv = b[k];
    if (k === "createdAt") { av = a.created; bv = b.created; }
    if (k === "updatedAt") { av = a.updated; bv = b.updated; }
    if (typeof av === "string") return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
  return rows;
}

function renderList() {
  const rows = currentRows();
  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = '<div class="empty">No workflows match the current filter.</div>'; return; }
  list.innerHTML = rows.map(n => `
    <details class="card" data-id="${n.id}">
      <summary class="row">
        <span class="twisty">▶</span>
        <span class="name" title="${escapeHtml(n.name)}">${escapeHtml(n.name)}</span>
        <span><span class="badge role-${n.role}">${n.role}</span></span>
        <span class="deg">calls ${n.outDeg} · called by ${n.inDeg}</span>
        <span class="date">${fmtDate(n.created)}</span>
        <span class="date">${fmtDate(n.updated)}</span>
      </summary>
      <div class="body">
        <div class="meta">
          <div><span>Created</span>${fmtDateTime(n.created)}</div>
          <div><span>Updated</span>${fmtDateTime(n.updated)}</div>
          <div><span>Workflow ID</span>${escapeHtml(n.id)}</div>
        </div>
        <div class="trigs-wrap">
          <span class="col-head">Triggers</span>
          ${renderTriggers(n.triggers)}
        </div>
        <div class="diagram"><div class="empty">Loading map…</div></div>
      </div>
    </details>`).join("");

  list.querySelectorAll("details.card").forEach(d => {
    d.addEventListener("toggle", () => {
      if (d.open && !d.dataset.rendered) {
        d.dataset.rendered = "1";
        renderDiagramInto(d.querySelector(".diagram"), d.dataset.id);
      }
    });
  });
}

// Collect everything reachable up (ancestors) and down (descendants) from id.
function connected(id) {
  const keep = new Set([id]);
  const walk = (start, map) => {
    const stack = [start];
    while (stack.length) {
      const cur = stack.pop();
      for (const nxt of map[cur] || []) if (!keep.has(nxt)) { keep.add(nxt); stack.push(nxt); }
    }
  };
  walk(id, state.children);
  walk(id, state.parents);
  return keep;
}

async function renderDiagramInto(el, id) {
  const keep = connected(id);
  if (keep.size <= 1) {
    el.innerHTML = '<div class="empty">This workflow has no parent or child workflows (single).</div>';
    return;
  }
  const lines = ["flowchart TD"];
  for (const nid of keep) lines.push(`    ${state.byId[nid].alias}["${mmLabel(state.byId[nid].name)}"]`);
  for (const [from, to] of state.edges) {
    if (keep.has(from) && keep.has(to)) lines.push(`    ${state.byId[from].alias} --> ${state.byId[to].alias}`);
  }
  lines.push(`    classDef selected fill:#2a3a52,stroke:#4aa3ff,stroke-width:3px,color:#fff;`);
  lines.push(`    class ${state.byId[id].alias} selected;`);
  try {
    const { svg } = await mermaid.render("g" + Math.random().toString(36).slice(2), lines.join("\n"));
    el.innerHTML = svg;
  } catch (e) {
    el.innerHTML = `<div class="empty">Mermaid render error: ${escapeHtml(String(e.message || e))}</div>`;
  }
}

function renderTriggers(triggers) {
  if (!triggers || !triggers.length) return '<span class="empty" style="padding:0">No triggers</span>';
  return '<div class="trigs">' + triggers.map(t => {
    const on = t.enabled === true || t.enabled === "true";
    return `<span class="trig ${on ? "on" : "off"}">${escapeHtml(t.name || "(unnamed)")} · ${on ? "enabled" : "disabled"}</span>`;
  }).join("") + '</div>';
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function mmLabel(s) { return s.replace(/"/g, "&quot;"); }

// ---- events ----
